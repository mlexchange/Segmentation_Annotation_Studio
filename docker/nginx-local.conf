# Minimal stripping reverse proxy for docker-compose.local.yml — simulates
# the hub.als.lbl.gov-style proxy the `:als`/`:local` base-path design
# actually depends on (see the "Base-path (subpath) deployment support"
# section of the deployment plan). The app container itself has NO idea it's
# hosted under /seg_studio/ — its static file serving and SPA catch-all only
# ever see plain root-relative paths. This proxy is what turns
# "localhost:5173/seg_studio/..." into "app-local:8002/..." before it ever
# reaches the container, exactly like the real reverse proxy would strip
# "hub.als.lbl.gov/bl832/seg_studio/..." down to "/...".
server {
    listen 80;

    location = / {
        return 302 /seg_studio/;
    }

    location /seg_studio/ {
        # Resolve at request time (Docker's embedded DNS), not once at nginx
        # startup — a plain `proxy_pass http://app-local:8002` fails hard at
        # boot if app-local isn't up yet, and keeps a stale IP across an
        # app-local restart/recreate. `set` must come BEFORE the `rewrite...
        # break`, since `break` halts further rewrite-module directives
        # (including a later `set`) in this block.
        resolver 127.0.0.11 valid=10s;
        set $upstream app-local:8002;
        rewrite ^/seg_studio/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
