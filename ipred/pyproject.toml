[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipred"
version = "0.1.0"
description = "Generic iterative prediction backend (features, train plugins, conformal products)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "pillow>=10.3",
  "python-dotenv>=1.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "catboost>=1.2",
  "onnxruntime>=1.17",
  "tifffile>=2024.0",
  "httpx>=0.27",
  "tiled[client]>=0.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
torch = ["torch>=2.2", "timm>=1.0", "onnx>=1.16"]

[project.scripts]
ipred = "ipred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
