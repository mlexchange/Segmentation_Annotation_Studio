[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-annotation-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "tiled[all]>=0.1",
  "numpy>=1.26",
  "pillow>=10.3",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "pycocotools>=2.0.7",
  "scikit-image>=0.22",
  "tifffile>=2024.0",
  "imagecodecs",
]

[project.optional-dependencies]
dev  = ["flake8", "flake8-isort", "black"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
