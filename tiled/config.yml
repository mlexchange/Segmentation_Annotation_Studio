authentication:
  allow_anonymous_access: true
  # No hardcoded key: Tiled expands ${TILED_API_KEY} from the environment at load
  # time. start_all.sh generates it into backend/.env (gitignored) and exports it.
  # Serving this config requires TILED_API_KEY to be set (anonymous access is read-only).
  single_user_api_key: "${TILED_API_KEY}"

allow_origins:
  - "http://127.0.0.1:5173"
  - "http://localhost:5173"

trees:
  - path: /
    tree: tiled.catalog:from_uri
    args:
      uri: "sqlite+aiosqlite:///./.tiled/catalog.db"
      writable_storage: ".tiled/data"
      readable_storage:
        - "/Users/david/Documents/data"
      init_if_not_exists: true

