authentication:
  allow_anonymous_access: true
  # No hardcoded key here. start_all.sh generates a key into backend/.env and
  # passes it to Tiled at launch via `--api-key` (version-robust; avoids depending
  # on YAML ${VAR} expansion). Anonymous access is read-only; the key authorizes writes.

allow_origins:
  - "http://127.0.0.1:5173"
  - "http://localhost:5173"

trees:
  - path: /
    tree: tiled.catalog:from_uri
    args:
      uri: "sqlite+aiosqlite:///./.tiled/catalog.db"
      writable_storage: ".tiled/data"
      readable_storage:
        - "/Users/david/Documents/data"
      init_if_not_exists: true

